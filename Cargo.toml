[workspace]
resolver = "2"
members = [
    "crates/flash-s3-common",
    "crates/flash-s3-engine",
    "crates/flash-s3-operator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Garmingo"]

[workspace.dependencies]
flash-s3-common = { path = "crates/flash-s3-common" }
anyhow = "1"
aes-gcm = "0.10"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
md-5 = "0.10"
moka = { version = "0.12", features = ["future"] }
parking_lot = "0.12"
prometheus = "0.13"
quick-xml = { version = "0.37", features = ["serialize"] }
rand = "0.8"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
urlencoding = "2"
dashmap = "6"
mime_guess = "2"
tempfile = "3"
async-trait = "0.1"
kube = { version = "0.98", features = ["runtime", "derive", "client"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }
schemars = "0.8"
futures-util = "0.3"
serde_yaml = "0.9"
jsonwebtoken = "9"
