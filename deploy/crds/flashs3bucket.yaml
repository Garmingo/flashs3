apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flashs3buckets.storage.flashs3.io
spec:
  group: storage.flashs3.io
  names:
    kind: FlashS3Bucket
    listKind: FlashS3BucketList
    plural: flashs3buckets
    shortNames:
      - fs3b
    singular: flashs3bucket
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Endpoint
          type: string
          jsonPath: .status.endpoint
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [size]
              properties:
                size:
                  type: string
                storageClassName:
                  type: string
                image:
                  type: string
                  default: registry.garmingo.net/garmingo/flashs3/engine:latest
                auth:
                  type: object
                  properties:
                    secretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                defaultObjectAcl:
                  type: string
                  default: private
                  enum: [private, public-read, public-read-write, authenticated-read]
                defaultBucketName:
                  type: string
                cache:
                  type: object
                  properties:
                    policy:
                      type: string
                      default: InMemoryLRU
                      enum: [None, InMemoryLRU]
                    maxSizeInBytes:
                      type: integer
                      format: int64
                      default: 2147483648
                    objectMaxSizeInBytes:
                      type: integer
                      format: int64
                      default: 4194304
                service:
                  type: object
                  properties:
                    type:
                      type: string
                      default: ClusterIP
                    port:
                      type: integer
                      default: 9000
                retainPvc:
                  type: boolean
                  default: true
            status:
              type: object
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
                message:
                  type: string
