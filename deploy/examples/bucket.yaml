apiVersion: storage.flashs3.io/v1alpha1
kind: FlashS3Bucket
metadata:
  name: media
  namespace: default
spec:
  size: 50Gi
  # storageClassName: longhorn
  image: ghcr.io/garmingo/flash-s3-engine:latest
  defaultObjectAcl: private
  cache:
    policy: InMemoryLRU
    maxSizeInBytes: 2147483648
    objectMaxSizeInBytes: 4194304
  service:
    type: ClusterIP
    port: 9000
  retainPvc: true
