apiVersion: storage.flashs3.io/v1alpha1
kind: FlashS3Bucket
metadata:
  name: media
  namespace: default
spec:
  size: 50Gi
  # storageClassName: longhorn
  image: docker.io/garmingo/flashs3:latest
  # Created automatically on engine startup.
  defaultBucketName: media-assets
  defaultObjectAcl: private
  # Applied to defaultBucketName on every engine start (browser uploads / CDN).
  # Dev shortcut: cors: { allowAll: true }
  cors:
    rules:
      - allowedOrigins:
          - http://localhost:3001
        allowedMethods: [PUT, GET, HEAD]
        allowedHeaders: ["*"]
        exposeHeaders: [ETag, x-amz-request-id]
        maxAgeSeconds: 3000
  cache:
    policy: InMemoryLRU
    maxSizeInBytes: 2147483648
    objectMaxSizeInBytes: 4194304
  service:
    type: ClusterIP
    port: 9000
  retainPvc: true
