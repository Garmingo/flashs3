name: Release

# Runs only when a tag is pushed (= release), like the old GitLab pipeline.
# Builds the engine and operator images in parallel and pushes them to Docker Hub,
# tagged with the release tag and `latest`. The tag is passed as build arg VERSION
# so the Rust binaries report it (`--version` / startup logs).
on:
  push:
    tags: ['*']

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: garmingo

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: flashs3
            dockerfile: Dockerfile
          - image: flashs3-operator
            dockerfile: Dockerfile.operator
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
