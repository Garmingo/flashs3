# GitLab CI for FlashS3.
#
# Pipeline runs only when a tag is pushed — i.e. on Release creation. A
# release created via the GitLab UI or release-cli creates a Git tag, which
# triggers this pipeline. Branch pushes (incl. master) do not build.
#
# Two Kaniko jobs build the engine and operator images in parallel and push
# them to Docker Hub. Each image is tagged with
# the release tag (e.g. v0.1.1) and with `latest`. The same tag is passed as
# Docker build-arg VERSION so the Rust binaries report that version
# (`--version` / startup logs).

stages:
  - build

# Gate the whole pipeline on tag pushes. Without this, MR pipelines + branch
# pushes would also try to build and burn registry quota / runner minutes.
workflow:
  rules:
    - if: $CI_COMMIT_TAG

# Shared scaffolding for the image builds. Kaniko's `-debug` image ships a
# `/busybox/sh` so the `before_script` can write the docker auth config; the
# regular `executor` image is statically linked and has no shell.
.build_template:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    # Docker Hub accepts namespace/repository references only. Keep the
    # layer cache in its own repository rather than a nested `/cache` path.
    DOCKERHUB_NAMESPACE: "garmingo"
    KANIKO_CACHE: "$DOCKERHUB_NAMESPACE/flashs3-build-cache"
  before_script:
    # Set DOCKERHUB_USERNAME and masked/protected DOCKERHUB_TOKEN as GitLab
    # CI/CD variables. Kaniko uses the standard Docker credential config.
    - mkdir -p /kaniko/.docker
    - |
      cat > /kaniko/.docker/config.json <<EOF
      {"auths":{"https://index.docker.io/v1/":{"username":"$DOCKERHUB_USERNAME","password":"$DOCKERHUB_TOKEN"}}}
      EOF
  script:
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/$DOCKERFILE_PATH"
      --destination "$DOCKERHUB_NAMESPACE/$IMAGE_NAME:$CI_COMMIT_TAG"
      --destination "$DOCKERHUB_NAMESPACE/$IMAGE_NAME:latest"
      --cache=true
      --cache-repo "$KANIKO_CACHE"
      --single-snapshot
      --snapshot-mode=redo
      --build-arg "VERSION=$CI_COMMIT_TAG"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.version=$CI_COMMIT_TAG"

build:engine:
  extends: .build_template
  variables:
    IMAGE_NAME: flashs3
    DOCKERFILE_PATH: Dockerfile

build:operator:
  extends: .build_template
  variables:
    IMAGE_NAME: flashs3-operator
    DOCKERFILE_PATH: Dockerfile.operator

# Note: no separate `release:` job. Releases are created manually in the
# GitLab UI (which is what creates the tag that triggers this pipeline).
# Image pull refs after a successful pipeline:
#   docker.io/garmingo/flashs3:$CI_COMMIT_TAG
#   docker.io/garmingo/flashs3-operator:$CI_COMMIT_TAG
